production:
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12
  scan_client_sitemaps:
    command: "Client.kept.active.find_each { |client| ScanClientSitemapJob.perform_later(client.id) }"
    schedule: every day at 3am
  enqueue_monthly_reports:
    class: EnqueueMonthlyReportsJob
    schedule: every 1st of the month at 4am
